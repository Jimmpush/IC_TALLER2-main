<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1F1E" />
      <stop offset="100%" stop-color="#121312" />
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2D312E" />
      <stop offset="50%" stop-color="#454A46" />
      <stop offset="100%" stop-color="#1E201F" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8F36A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101311" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1F2420" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#606662" />
      <stop offset="60%" stop-color="#1D1F1E" />
      <stop offset="100%" stop-color="#0A0B0A" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="24" fill="url(#bg)" />

  <!-- Subtle Architectural grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="240" x2="900" y2="240" />
    <line x1="0" y1="320" x2="900" y2="320" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="450" y1="0" x2="450" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
  </g>

  <!-- Studio Ambient Floor Reflection -->
  <ellipse cx="450" cy="335" rx="380" ry="42" fill="#000000" opacity="0.6" />
  <ellipse cx="450" cy="332" rx="320" ry="25" fill="#C8F36A" opacity="0.12" filter="url(#glow)" />

  <!-- Car Body Silhouette & Lines -->
  <g transform="translate(0, 10)">
    <!-- Cabin Roof -->
    <path d="M 160 210 Q 280 130 450 130 Q 600 130 720 200" fill="none" stroke="#686F6B" stroke-width="4" stroke-linecap="round" />
    
    <!-- Main Body Base -->
    <path d="M 90 260 L 140 210 L 730 200 L 810 240 L 820 280 L 760 300 L 120 300 Z" fill="url(#carBody)" stroke="#3E433F" stroke-width="2" />

    <!-- Tinted Windows -->
    <path d="M 220 200 L 320 145 L 470 145 L 470 200 Z M 490 200 L 490 145 L 610 145 L 680 200 Z" fill="url(#glass)" stroke="#4A504B" stroke-width="1.5" />

    <!-- Signature Accent Character Line -->
    <path d="M 150 235 Q 450 230 780 220" fill="none" stroke="#C8F36A" stroke-width="3" opacity="0.85" />
    <line x1="120" y1="260" x2="790" y2="250" stroke="#7E8781" stroke-width="1.5" opacity="0.5" />

    <!-- Headlights & Taillights -->
    <!-- Front LED Light -->
    <path d="M 750 215 L 810 230 L 780 240 Z" fill="#C8F36A" filter="url(#glow)" opacity="0.9" />
    <!-- Rear Light -->
    <path d="M 120 225 L 95 240 L 130 245 Z" fill="#FF4438" opacity="0.85" filter="url(#glow)" />

    <!-- Wheels and Rims -->
    <!-- Front Wheel -->
    <g transform="translate(670, 290)">
      <circle cx="0" cy="0" r="48" fill="url(#wheelGrad)" stroke="#111" stroke-width="6" />
      <circle cx="0" cy="0" r="32" fill="#202220" stroke="#505551" stroke-width="2" />
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#C8F36A" stroke-width="3" opacity="0.8" />
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#8A928D" stroke-width="3" />
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#8A928D" stroke-width="2.5" />
      <line x1="-22" y1="22" x2="22" y2="-22" stroke="#8A928D" stroke-width="2.5" />
      <circle cx="0" cy="0" r="10" fill="#111" stroke="#C8F36A" stroke-width="2" />
    </g>

    <!-- Rear Wheel -->
    <g transform="translate(230, 290)">
      <circle cx="0" cy="0" r="48" fill="url(#wheelGrad)" stroke="#111" stroke-width="6" />
      <circle cx="0" cy="0" r="32" fill="#202220" stroke="#505551" stroke-width="2" />
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#C8F36A" stroke-width="3" opacity="0.8" />
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#8A928D" stroke-width="3" />
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#8A928D" stroke-width="2.5" />
      <line x1="-22" y1="22" x2="22" y2="-22" stroke="#8A928D" stroke-width="2.5" />
      <circle cx="0" cy="0" r="10" fill="#111" stroke="#C8F36A" stroke-width="2" />
    </g>
  </g>

  <!-- Editorial typography & badges overlay -->
  <g transform="translate(48, 56)">
    <rect x="0" y="0" width="auto" height="26" rx="13" fill="#2D302E" />
    <text x="14" y="18" fill="#C8F36A" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SEDÁN LÍDER</text>
    <text x="0" y="58" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Toyota Yaris 2024</text>
    <text x="0" y="80" fill="#8E948F" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">1.5 XLI CVT · Nuevo</text>
  </g>

  <!-- Watermark AUTOIA -->
  <text x="840" y="60" text-anchor="end" fill="#ffffff" fill-opacity="0.12" font-family="system-ui, sans-serif" font-size="16" font-weight="900" letter-spacing="3">AUTOIA</text>
</svg>